[package]
name = "candy-term"
version = "0.2.0"
description = "candy-term / 糖果终端 — High-performance SSH & SFTP desktop client built with Rust and Tauri"
authors = ["candy-term contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "candy_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
russh = "0.65"
russh-sftp = "4.0"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
